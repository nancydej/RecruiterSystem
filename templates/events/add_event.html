<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Event</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        h1 { margin-bottom: 20px; }
        form { background: white; padding: 24px; border-radius: 6px; max-width: 480px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        textarea { min-height: 80px; resize: vertical; }
        .actions { display: flex; gap: 8px; margin-top: 16px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; text-decoration: none; }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
    <h1>Add Event</h1>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Event Name</label>
            <label>
                <input type="text" name="event_name" required>
            </label>
        </div>
        <div class="form-group">
            <label>Description</label>
            <label>
                <textarea name="description"></textarea>
            </label>
        </div>
        <div class="form-group">
            <label>City</label>
            <label>
                <input type="text" name="city" required>
            </label>
        </div>
        <div class="form-group">
            <label>State</label>
            <label>
                <input type="text" name="state" required>
            </label>
        </div>
        <div class="form-group">
            <label>Date & Time</label>
            <label>
                <input type="datetime-local" name="event_datetime" required>
            </label>
        </div>
        <div class="form-group">
            <label>Capacity</label>
            <label>
                <input type="number" name="capacity" min="1" required>
            </label>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Create Event</button>
            <a href="{% url 'manage_events' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</body>
</html>
