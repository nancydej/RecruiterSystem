{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #333;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #5545FE;
            padding: 14px 24px;
            color: white;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 16px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        .page-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .hero p {
            color: #666;
        }

        .form-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111;
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">Recruiter System</div>

    <ul class="nav-links">
        <li><a href="{% url 'home' %}">Events</a></li>
        <li><a href="{% url 'my_registrations' %}">Registrations</a></li>
        <li><a href="{% url 'manage_users' %}">Users</a></li>
        <li><a href="{% url 'logout' %}">Logout</a></li>
    </ul>
</nav>

<div class="page-container">

    <div class="hero">
        <h1>Edit User</h1>
        <p>Update account details and role</p>
    </div>

    <div class="form-card">

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" value="{{ user.username }}" required>
            </div>

            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" value="{{ user.first_name }}">
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" value="{{ user.last_name }}">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone_number" value="{{ user.phone_number }}">
            </div>

            <div class="form-group">
                <label>Role</label>
                <select name="role">
                    <option value="Admin" {% if user.role == "Admin" %}selected{% endif %}>Admin</option>
                    <option value="Event Coordinator" {% if user.role == "Event Coordinator" %}selected{% endif %}>Event Coordinator</option>
                    <option value="Recruiter" {% if user.role == "Recruiter" %}selected{% endif %}>Recruiter</option>
                </select>
            </div>

            <div class="actions">
                <a href="{% url 'manage_users' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
