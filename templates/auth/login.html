{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recruiter System | Login</title>

    <style>

        /* =========================
           BASE STYLES
        ========================= */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #333;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #5545FE;
            padding: 14px 24px;
            color: white;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
        }

        /* =========================
           PAGE CONTAINER
        ========================= */

        .page-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            text-align: center;
            padding: 40px 20px 20px;
        }

        .hero h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .hero p {
            color: #666;
        }

        /* =========================
           LOGIN CARD
        ========================= */

        .card {
            max-width: 420px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        .card-banner {
            background: #5545FE;
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .card-banner h2 {
            margin: 0;
            font-size: 20px;
        }

        /* =========================
           FORM
        ========================= */

        form p {
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        /* =========================
           BUTTON
        ========================= */

        .btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #4f46e5;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn:hover {
            opacity: 0.85;
        }

        /* =========================
           ERROR
        ========================= */

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        /* =========================
           SIGNUP LINK
        ========================= */

        .signup-link {
            text-align: center;
            margin-top: 18px;
        }

        .signup-link a {
            color: #5545FE;
            text-decoration: none;
            font-weight: bold;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">Recruiter System</div>
</nav>

<div class="page-container">

    <!-- HERO -->
    <div class="hero">
        <h1>Recruiter Event Management System</h1>
        <p>Login to manage events and registrations</p>
    </div>

    <!-- LOGIN CARD -->
    <div class="card">

        <div class="card-banner">
            <h2>Login</h2>
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <p>Email</p>
            <input type="email" name="email" required>

            <p>Password</p>
            <input type="password" name="password" required>

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <div class="signup-link">
            Don't have an account?
            <a href="{% url 'signup' %}">
                Sign Up
            </a>
        </div>

    </div>

</div>

</body>
</html>
